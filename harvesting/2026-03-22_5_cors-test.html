<html><head><title>CORS Test</title></head><body>
<h1>CORS Fetch Test</h1>
<p id="result">Loading...</p>
<script>
fetch('running-estimate-v4.json')
  .then(r => r.json())
  .then(d => document.getElementById('result').textContent = 'CORS OK: ' + d.meta.version)
  .catch(e => document.getElementById('result').textContent = 'CORS BLOCKED: ' + e.message);
</script>
</body></html>
