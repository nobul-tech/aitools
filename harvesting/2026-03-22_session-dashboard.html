<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session 5HyCwPtSDH — Subagent Activity Report</title>
<style>
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --bg-hover: #30363d;
    --border: #30363d;
    --border-light: #484f58;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent-blue: #58a6ff;
    --accent-green: #3fb950;
    --accent-yellow: #d29922;
    --accent-red: #f85149;
    --accent-purple: #bc8cff;
    --accent-orange: #f0883e;
    --accent-cyan: #56d4dd;
    --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --radius: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { font-size: 14px; scroll-behavior: smooth; }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-sans);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Fixed Header ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    box-shadow: var(--shadow);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 12px;
  }

  .header-title {
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .header-title span {
    color: var(--text-secondary);
    font-weight: 400;
    font-size: 0.9rem;
  }

  .session-id {
    font-family: var(--font-mono);
    color: var(--accent-blue);
    font-size: 0.85rem;
  }

  /* ── Stats Bar ── */
  .stats-bar {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .stat-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-value {
    font-size: 1.2rem;
    font-weight: 700;
    font-family: var(--font-mono);
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stat-value.green { color: var(--accent-green); }
  .stat-value.yellow { color: var(--accent-yellow); }
  .stat-value.red { color: var(--accent-red); }
  .stat-value.blue { color: var(--accent-blue); }
  .stat-value.purple { color: var(--accent-purple); }
  .stat-value.orange { color: var(--accent-orange); }
  .stat-value.cyan { color: var(--accent-cyan); }

  /* ── Controls ── */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    padding: 12px 24px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
  }

  .filter-group {
    display: flex;
    gap: 4px;
  }

  .filter-btn {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 4px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.8rem;
    font-family: var(--font-sans);
    transition: all 0.15s;
  }

  .filter-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  .filter-btn.active {
    background: var(--accent-blue);
    color: #fff;
    border-color: var(--accent-blue);
  }

  .search-box {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 5px 12px;
    border-radius: var(--radius);
    font-size: 0.85rem;
    font-family: var(--font-sans);
    width: 280px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-box:focus {
    border-color: var(--accent-blue);
  }

  .search-box::placeholder {
    color: var(--text-muted);
  }

  .view-toggle {
    margin-left: auto;
    display: flex;
    gap: 4px;
  }

  /* ── Session Summary Section ── */
  .session-summary {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    margin-top: 12px;
  }

  @media (max-width: 900px) {
    .summary-grid { grid-template-columns: 1fr; }
  }

  .summary-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .summary-card-title {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .summary-card-content {
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  .summary-card-content strong {
    color: var(--text-primary);
  }

  .summary-card-content .highlight-value {
    color: var(--accent-blue);
    font-family: var(--font-mono);
    font-weight: 600;
  }

  .compliance-bar {
    margin-top: 8px;
    background: var(--bg-primary);
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
    position: relative;
  }

  .compliance-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  .compliance-fill.green { background: var(--accent-green); }
  .compliance-fill.yellow { background: var(--accent-yellow); }
  .compliance-fill.red { background: var(--accent-red); }

  .convergence-item {
    padding: 4px 0;
    border-bottom: 1px solid rgba(48, 54, 61, 0.5);
  }

  .convergence-item:last-child {
    border-bottom: none;
  }

  .convergence-label {
    color: var(--accent-purple);
    font-weight: 600;
    font-size: 0.8rem;
  }

  .convergence-agents {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* ── Delegation Compliance Score ── */
  .compliance-section {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
  }

  .compliance-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-top: 12px;
  }

  @media (max-width: 768px) {
    .compliance-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .compliance-item {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    text-align: center;
  }

  .compliance-item-value {
    font-size: 1.4rem;
    font-weight: 700;
    font-family: var(--font-mono);
  }

  .compliance-item-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-top: 2px;
  }

  /* ── Timeline ── */
  .timeline-section {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
  }

  .section-title {
    font-size: 0.85rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .timeline-container {
    overflow-x: auto;
    padding-bottom: 8px;
  }

  .timeline {
    position: relative;
    min-height: 60px;
    width: 100%;
    min-width: 900px;
  }

  .timeline-axis {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--border);
  }

  .timeline-labels {
    display: flex;
    justify-content: space-between;
    padding-top: 4px;
    font-size: 0.7rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  .timeline-bars {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-bottom: 20px;
  }

  .timeline-row {
    display: flex;
    align-items: center;
    height: 18px;
    position: relative;
  }

  .timeline-bar-label {
    width: 55px;
    font-size: 0.65rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
    text-align: right;
    padding-right: 6px;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
  }

  .timeline-bar-track {
    flex: 1;
    position: relative;
    height: 100%;
  }

  .timeline-bar {
    position: absolute;
    height: 12px;
    top: 3px;
    border-radius: 2px;
    cursor: pointer;
    transition: opacity 0.15s;
    min-width: 3px;
  }

  .timeline-bar:hover {
    opacity: 0.8;
  }

  .timeline-bar.status-completed { background: var(--accent-green); }
  .timeline-bar.status-blocked { background: var(--accent-yellow); }
  .timeline-bar.status-running { background: var(--accent-blue); }
  .timeline-bar.status-error { background: var(--accent-red); }
  .timeline-bar.status-inline { background: var(--accent-purple); }
  .timeline-bar.status-partial { background: var(--accent-orange); }

  .timeline-bar .tooltip {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-primary);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: var(--radius);
    font-size: 0.75rem;
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
  }

  .timeline-bar:hover .tooltip {
    display: block;
  }

  .timeline-bar.fragord-pattern {
    background: repeating-linear-gradient(
      45deg,
      var(--accent-yellow),
      var(--accent-yellow) 3px,
      rgba(210, 153, 34, 0.4) 3px,
      rgba(210, 153, 34, 0.4) 6px
    );
  }

  /* ── Agent Cards ── */
  .agents-container {
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .agent-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }

  .agent-card:hover {
    border-color: var(--border-light);
  }

  .agent-card.highlight {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 1px var(--accent-blue);
  }

  .agent-card.fragord-card {
    border-left: 3px solid var(--accent-yellow);
  }

  .agent-card-header {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    align-items: center;
  }

  .agent-card-header:hover {
    background: var(--bg-tertiary);
  }

  .agent-number {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    font-family: var(--font-mono);
    flex-shrink: 0;
  }

  .agent-number.role-s2 { background: #1f3a5f; color: var(--accent-blue); }
  .agent-number.role-s3 { background: #1a3d2a; color: var(--accent-green); }
  .agent-number.role-verifier { background: #3d2e1a; color: var(--accent-orange); }

  .agent-info {
    min-width: 0;
  }

  .agent-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .agent-mission {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text-primary);
  }

  .agent-role-badge {
    font-size: 0.7rem;
    padding: 1px 8px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }

  .agent-role-badge.role-s2 { background: #1f3a5f; color: var(--accent-blue); }
  .agent-role-badge.role-s3 { background: #1a3d2a; color: var(--accent-green); }
  .agent-role-badge.role-verifier { background: #3d2e1a; color: var(--accent-orange); }

  .agent-meta {
    display: flex;
    gap: 12px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .agent-meta-item {
    font-size: 0.75rem;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .agent-meta-item .icon {
    font-size: 0.8rem;
  }

  .agent-status {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .status-badge {
    font-size: 0.7rem;
    padding: 2px 10px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .status-badge.completed { background: #1a3d2a; color: var(--accent-green); }
  .status-badge.blocked { background: #3d351a; color: var(--accent-yellow); }
  .status-badge.running { background: #1a2a3d; color: var(--accent-blue); }
  .status-badge.error { background: #3d1a1a; color: var(--accent-red); }
  .status-badge.inline { background: #2a1a3d; color: var(--accent-purple); }
  .status-badge.partial { background: #3d2a1a; color: var(--accent-orange); }

  .fragord-badge {
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(210, 153, 34, 0.15);
    color: var(--accent-yellow);
    border: 1px solid rgba(210, 153, 34, 0.3);
    font-family: var(--font-mono);
    font-weight: 600;
  }

  .expand-icon {
    color: var(--text-muted);
    transition: transform 0.2s;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .agent-card.expanded .expand-icon {
    transform: rotate(90deg);
  }

  /* ── Card Detail ── */
  .agent-detail {
    display: none;
    border-top: 1px solid var(--border);
    padding: 16px;
    background: var(--bg-primary);
  }

  .agent-card.expanded .agent-detail {
    display: block;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 768px) {
    .detail-grid { grid-template-columns: 1fr; }
  }

  .detail-section {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }

  .detail-section-title {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .detail-section-content {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .detail-section-content.mono {
    font-family: var(--font-mono);
    font-size: 0.8rem;
  }

  .file-path {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--accent-blue);
    display: block;
    padding: 2px 0;
    word-break: break-all;
  }

  .skill-tag {
    display: inline-block;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--accent-purple);
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 0.75rem;
    font-family: var(--font-mono);
    margin: 2px;
  }

  .finding-text {
    font-size: 0.85rem;
    color: var(--text-primary);
    line-height: 1.6;
    padding: 8px 12px;
    background: var(--bg-tertiary);
    border-left: 3px solid var(--accent-blue);
    border-radius: 0 var(--radius) var(--radius) 0;
  }

  .note-text {
    font-size: 0.8rem;
    color: var(--accent-yellow);
    padding: 6px 10px;
    background: rgba(210, 153, 34, 0.1);
    border: 1px solid rgba(210, 153, 34, 0.3);
    border-radius: var(--radius);
    margin-top: 8px;
  }

  /* ── Context Injection Section ── */
  .context-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 2px 0;
    font-size: 0.82rem;
    color: var(--text-secondary);
  }

  .context-bullet {
    color: var(--accent-cyan);
    font-size: 0.7rem;
    flex-shrink: 0;
  }

  /* ── Delegation Duty Checklist ── */
  .duty-checklist {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 12px;
  }

  .duty-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    padding: 2px 0;
  }

  .duty-check {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  .duty-check.pass {
    background: rgba(63, 185, 80, 0.2);
    color: var(--accent-green);
    border: 1px solid rgba(63, 185, 80, 0.4);
  }

  .duty-check.fail {
    background: rgba(248, 81, 73, 0.2);
    color: var(--accent-red);
    border: 1px solid rgba(248, 81, 73, 0.4);
  }

  .duty-label {
    color: var(--text-secondary);
  }

  /* ── AAR Outcome ── */
  .aar-outcome {
    font-size: 0.85rem;
    color: var(--text-primary);
    padding: 8px 12px;
    background: var(--bg-tertiary);
    border-left: 3px solid var(--accent-green);
    border-radius: 0 var(--radius) var(--radius) 0;
  }

  /* ── Deviations ── */
  .deviation-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 0;
    font-size: 0.82rem;
    color: var(--accent-orange);
  }

  .deviation-bullet {
    color: var(--accent-red);
    font-size: 0.7rem;
    flex-shrink: 0;
  }

  /* ── Spot Check ── */
  .spot-check-text {
    font-size: 0.85rem;
    color: var(--text-secondary);
    padding: 6px 10px;
    background: var(--bg-tertiary);
    border-left: 3px solid var(--accent-purple);
    border-radius: 0 var(--radius) var(--radius) 0;
  }

  /* ── Prompt Collapsible ── */
  .prompt-section {
    margin-top: 12px;
  }

  .prompt-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.8rem;
    padding: 6px 0;
    user-select: none;
  }

  .prompt-toggle:hover {
    color: var(--text-primary);
  }

  .prompt-toggle .arrow {
    transition: transform 0.2s;
    font-size: 0.7rem;
  }

  .prompt-toggle.open .arrow {
    transform: rotate(90deg);
  }

  .prompt-content {
    display: none;
    margin-top: 8px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    line-height: 1.6;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 500px;
    overflow-y: auto;
  }

  .prompt-content.open {
    display: block;
  }

  .full-width {
    grid-column: 1 / -1;
  }

  /* ── Worktree Badge ── */
  .worktree-badge {
    font-size: 0.65rem;
    padding: 1px 6px;
    border-radius: 4px;
    background: rgba(188, 140, 255, 0.15);
    color: var(--accent-purple);
    border: 1px solid rgba(188, 140, 255, 0.3);
    font-family: var(--font-mono);
  }

  /* ── Legend ── */
  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    color: var(--text-muted);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
  }

  .legend-dot.green { background: var(--accent-green); }
  .legend-dot.yellow { background: var(--accent-yellow); }
  .legend-dot.blue { background: var(--accent-blue); }
  .legend-dot.red { background: var(--accent-red); }
  .legend-dot.purple { background: var(--accent-purple); }
  .legend-dot.orange { background: var(--accent-orange); }
  .legend-dot.fragord {
    background: repeating-linear-gradient(
      45deg,
      var(--accent-yellow),
      var(--accent-yellow) 2px,
      rgba(210, 153, 34, 0.4) 2px,
      rgba(210, 153, 34, 0.4) 4px
    );
  }

  /* ── Hidden utility ── */
  .hidden { display: none !important; }

  /* ── Scrollbar ── */

const dutyComponents = ["identityEstablished", "priorResultsIncluded", "criticalRulesInjected", "aarFormatRequired", "writeBlockedSignal"];
let totalDutyChecks = 0;
let totalDutyPasses = 0;
agents.forEach(a => {
  dutyComponents.forEach(c => {
    totalDutyChecks++;
    if (a.delegationDutyFulfilled[c]) totalDutyPasses++;
  });
});
const compliancePct = Math.round((totalDutyPasses / totalDutyChecks) * 100);

// Per-component compliance
const perComponentCompliance = {};
dutyComponents.forEach(c => {
  const passes = agents.filter(a => a.delegationDutyFulfilled[c]).length;
  perComponentCompliance[c] = Math.round((passes / totalAgents) * 100);
});

// AAR stats
const agentsWithAar = agents.filter(a => a.aarOutcome && a.aarOutcome !== null);
const aarCount = agentsWithAar.length;

// Total proposals (extracted from aarOutcome text)
function extractProposalCount(text) {
  if (!text) return 0;
  const match = text.match(/(\d+)\s*proposals?/i);
  return match ? parseInt(match[1]) : 0;
}
function extractObservationCount(text) {
  if (!text) return 0;
  const match = text.match(/(\d+)\s*observations?/i);
  return match ? parseInt(match[1]) : 0;
}
function extractInsightCount(text) {
  if (!text) return 0;
  const match = text.match(/(\d+)\s*insights?/i);
  return match ? parseInt(match[1]) : 0;
}

const totalProposals = agents.reduce((s, a) => s + extractProposalCount(a.aarOutcome), 0);
const totalObservations = agents.reduce((s, a) => s + extractObservationCount(a.aarOutcome), 0);
const totalInsights = agents.reduce((s, a) => s + extractInsightCount(a.aarOutcome), 0);

// Total deviations
const totalDeviations = agents.reduce((s, a) => s + a.deviations.length, 0);

function formatTokens(n) {
  if (!n || n === 0) return "n/a";
  if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
  if (n >= 1000) return Math.round(n / 1000) + "K";
  return n.toString();
}

function formatDuration(s) {
  if (!s || s === 0) return "inline";
  if (s >= 3600) return Math.floor(s/3600) + "h " + Math.floor((s%3600)/60) + "m";
  if (s >= 60) return Math.floor(s/60) + "m " + (s%60) + "s";
  return s + "s";
}

function renderTimeline() {
  const durationsWithValues = agents.filter(a => a.duration && a.duration > 0).map(a => a.duration);
  const maxDur = Math.max(...durationsWithValues, 1);
  const container = document.getElementById("timeline");

  let html = '<div class="timeline-bars">';
  agents.forEach(a => {
    const dur = a.duration || 0;
    const widthPct = dur === 0 ? 0.5 : (dur / maxDur) * 100;
    const isRunning = a.status === "running";
    const statusCls = a.isFragord ? "fragord-pattern" :
                      a.status === "completed" ? "status-completed" :
                      a.status === "blocked" ? "status-blocked" :
                      a.status === "running" ? "status-running" :
                      "status-inline";
    const fragordLabel = a.isFragord ? " [FRAGORD]" : "";
    const fragordRelaunch = a.fragordOf ? ` (relaunch of #${a.fragordOf})` : "";
    const durLabel = isRunning ? "running" : a.durationLabel;
    const tokLabel = a.tokenLabel || "TBD";
    const barWidth = isRunning ? 100 : Math.max(widthPct, 0.4);

    html += `
      <div class="timeline-row" data-agent-id="${a.id}">
        <div class="timeline-bar-label">#${a.id}</div>
        <div class="timeline-bar-track">
          <div class="timeline-bar ${statusCls}"
               style="left: 0; width: ${barWidth}%;${isRunning ? ' opacity: 0.5; animation: pulse 2s infinite;' : ''}"
               onclick="scrollToAgent(${a.id})">
            <div class="tooltip">#${a.id} ${a.description}${fragordLabel}${fragordRelaunch} &mdash; ${durLabel}, ${tokLabel} tokens</div>
          </div>
        </div>
      </div>`;
  });
  html += '</div>';

  html += `
    <div class="timeline-axis"></div>
    <div class="timeline-labels">
      <span>0s</span>
      <span>${formatDuration(Math.round(maxDur * 0.25))}</span>
      <span>${formatDuration(Math.round(maxDur * 0.5))}</span>
      <span>${formatDuration(Math.round(maxDur * 0.75))}</span>
      <span>${formatDuration(maxDur)}</span>
    </div>`;

  container.innerHTML = html;
}
renderTimeline();

    return `
    <div class="agent-card${fragordCardClass}" id="agent-${a.id}" data-role="${a.role}" data-status="${a.status}">
      <div class="agent-card-header" onclick="toggleCard(${a.id})">
        <div class="agent-number ${roleCls}">${a.id}</div>
        <div class="agent-info">
          <div class="agent-title-row">
            <span class="agent-mission">${escapeHtml(a.mission)}</span>
            <span class="agent-role-badge ${roleCls}">${escapeHtml(a.roleLabel)}</span>
            ${worktreeBadge}${fragordBadge}${fragordOfBadge}
          </div>
          <div class="agent-meta">
            <span class="agent-meta-item"><span class="icon">&#9202;</span> ${a.durationLabel}</span>
            <span class="agent-meta-item"><span class="icon">&#9881;</span> ${a.tokenLabel} tokens</span>
            <span class="agent-meta-item"><span class="icon">&#9874;</span> ${a.toolUses !== null ? a.toolUses + ' tools' : 'TBD'}</span>
          </div>
        </div>
        <div class="agent-status">
          <span class="status-badge ${statusCls}">${a.statusLabel}</span>
          <span class="expand-icon">&#9654;</span>
        </div>
      </div>
      <div class="agent-detail">
        <!-- Row 1: Context + Intent -->
        <div class="detail-grid">
          <div class="detail-section">
            <div class="detail-section-title">Context Injected</div>
            <div class="detail-section-content">${contextHtml}</div>
          </div>
          <div class="detail-section">
            <div class="detail-section-title">Captured Intent (Auftrag)</div>
            <div class="detail-section-content">${intentHtml}</div>
          </div>
        </div>

        <!-- Row 2: Delegation Duty + AAR Outcome -->
        <div class="detail-grid">
          <div class="detail-section">
            <div class="detail-section-title">Delegation Duty Fulfillment</div>
            <div class="detail-section-content">${dutyHtml}</div>
          </div>
          <div class="detail-section">
            <div class="detail-section-title">AAR Outcome</div>
            <div class="detail-section-content">${aarHtml}</div>
          </div>
        </div>

        <!-- Row 3: Skills + Metrics -->
        <div class="detail-grid">
          <div class="detail-section">
            <div class="detail-section-title">Skills Used</div>
            <div class="detail-section-content">${skillsHtml}</div>
          </div>
          <div class="detail-section">
            <div class="detail-section-title">Metrics</div>
            <div class="detail-section-content mono">${metricsHtml}</div>
          </div>
        </div>

        <!-- Row 4: Output + Files Read -->
        <div class="detail-grid">
          <div class="detail-section">
            <div class="detail-section-title">Output</div>
            <div class="detail-section-content mono">${outputHtml}</div>
          </div>
          <div class="detail-section">
            <div class="detail-section-title">Files Instructed to Read</div>
            <div class="detail-section-content mono">${filesHtml}</div>
          </div>
        </div>

        <!-- Row 5: Key Finding (full width) -->
        <div class="detail-grid">
          <div class="detail-section full-width">
            <div class="detail-section-title">Key Finding</div>
            ${findingContent}
            ${noteHtml}
          </div>
        </div>

        <!-- Row 6: Deviations + Spot Check (full width) -->
        <div class="detail-grid">
          <div class="detail-section">
            <div class="detail-section-title">Deviations</div>
            <div class="detail-section-content">${deviationsHtml}</div>
          </div>
          <div class="detail-section">
            <div class="detail-section-title">Spot-Check Results</div>
            <div class="detail-section-content">${spotHtml}</div>
          </div>
        </div>

        <!-- Collapsible: Delegation Prompt -->
        <div class="prompt-section">
          <div class="prompt-toggle" onclick="togglePrompt(event, ${a.id})">
            <span class="arrow">&#9654;</span> Delegation Prompt
          </div>
          <div class="prompt-content" id="prompt-${a.id}">${escapeHtml(a.prompt)}</div>
        </div>
      </div>
    </div>`;
  }).join("");
}

renderAgents(agents);

// =================================================================
// INTERACTIONS
// =================================================================
function toggleCard(id) {
  const card = document.getElementById(`agent-${id}`);
  card.classList.toggle("expanded");
}

function togglePrompt(event, id) {
  event.stopPropagation();
  const toggle = event.currentTarget;
  const content = document.getElementById(`prompt-${id}`);
  toggle.classList.toggle("open");
  content.classList.toggle("open");
}

function scrollToAgent(id) {
  const card = document.getElementById(`agent-${id}`);
  if (card) {
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.add("highlight");
    setTimeout(() => card.classList.remove("highlight"), 2000);
  }
}

// -- Filters --
let activeRole = "all";
let activeStatus = "all";
let searchQuery = "";

function applyFilters() {
  let filtered = agents;

  if (activeRole !== "all") {
    filtered = filtered.filter(a => a.role === activeRole);
  }
  if (activeStatus !== "all") {
    filtered = filtered.filter(a => a.status === activeStatus);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(a =>
      a.mission.toLowerCase().includes(q) ||
      a.description.toLowerCase().includes(q) ||
      (a.finding && a.finding.toLowerCase().includes(q)) ||
      a.prompt.toLowerCase().includes(q) ||
      a.roleLabel.toLowerCase().includes(q) ||
      (a.output && a.output.toLowerCase().includes(q)) ||
      (a.note && a.note.toLowerCase().includes(q)) ||
      (a.capturedIntent && a.capturedIntent.toLowerCase().includes(q)) ||
      (a.aarOutcome && a.aarOutcome.toLowerCase().includes(q)) ||
      (a.spotCheckResults && a.spotCheckResults.toLowerCase().includes(q)) ||
      a.skills.some(s => s.toLowerCase().includes(q)) ||
      a.filesRead.some(f => f.toLowerCase().includes(q)) ||
      a.contextInjected.some(c => c.toLowerCase().includes(q)) ||
      a.deviations.some(d => d.toLowerCase().includes(q))
    );
  }

  renderAgents(filtered);

  // Update timeline visibility
  document.querySelectorAll(".timeline-row").forEach(row => {
    const id = parseInt(row.dataset.agentId);
    const visible = filtered.some(a => a.id === id);
    row.style.display = visible ? "flex" : "none";
  });
}

document.querySelectorAll("#roleFilters .filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#roleFilters .filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeRole = btn.dataset.role;
    applyFilters();
  });
});

document.querySelectorAll("#statusFilters .filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#statusFilters .filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeStatus = btn.dataset.status;
    applyFilters();
  });
});

document.getElementById("searchBox").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  applyFilters();
});

document.getElementById("expandAll").addEventListener("click", () => {
  document.querySelectorAll(".agent-card").forEach(c => c.classList.add("expanded"));
});

document.getElementById("collapseAll").addEventListener("click", () => {
  document.querySelectorAll(".agent-card").forEach(c => c.classList.remove("expanded"));
});

// -- Keyboard shortcuts --
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== "INPUT") {
    e.preventDefault();
    document.getElementById("searchBox").focus();
  }
  if (e.key === "Escape") {
    document.getElementById("searchBox").blur();
    document.getElementById("searchBox").value = "";
    searchQuery = "";
    applyFilters();
  }
});

// -- Pulse animation for running agents --
const style = document.createElement("style");
style.textContent = `@keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }`;
document.head.appendChild(style);
</script>
</body>
</html>
