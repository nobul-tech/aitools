const totalAgents = agents.length;
const totalTokens = agents.reduce((s, a) => s + a.tokens, 0);
const totalDuration = agents.reduce((s, a) => s + a.duration, 0);
const completedCount = agents.filter(a => a.status === "completed").length;
const blockedCount = agents.filter(a => a.status === "blocked").length;
const partialCount = agents.filter(a => a.status === "partial").length;
const totalToolUses = agents.reduce((s, a) => s + a.toolUses, 0);
const worktreeCount = agents.filter(a => a.worktree).length;

function formatTokens(n) {
  if (n === 0) return "n/a";
  if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
  if (n >= 1000) return Math.round(n / 1000) + "K";
  return n.toString();
}

function formatDuration(s) {
  if (s === 0) return "inline";
  if (s >= 3600) return Math.floor(s/3600) + "h " + Math.floor((s%3600)/60) + "m";
  if (s >= 60) return Math.floor(s/60) + "m " + (s%60) + "s";
  return s + "s";
}

function renderTimeline() {
  const maxDur = Math.max(...agents.map(a => a.duration), 1);
  const container = document.getElementById("timeline");

  // Cumulative start positions (sequential for visualization)
  let html = '<div class="timeline-bars">';
  agents.forEach(a => {
    const widthPct = a.duration === 0 ? 0.5 : (a.duration / maxDur) * 100;
    const statusCls = a.status === "completed" ? "status-completed" :
                      a.status === "blocked" ? "status-blocked" :
                      a.status === "partial" ? "status-partial" :
                      "status-inline";
    html += `
      <div class="timeline-row" data-agent-id="${a.id}">
        <div class="timeline-bar-label">#${a.id}</div>
        <div class="timeline-bar-track">
          <div class="timeline-bar ${statusCls}"
               style="left: 0; width: ${Math.max(widthPct, 0.4)}%;"
               onclick="scrollToAgent(${a.id})">
            <div class="tooltip">#${a.id} ${a.description} &mdash; ${a.durationLabel}, ${a.tokenLabel} tokens</div>
          </div>
        </div>
      </div>`;
  });
  html += '</div>';

  // Axis labels
  html += `
    <div class="timeline-axis"></div>
    <div class="timeline-labels">
      <span>0s</span>
      <span>${formatDuration(Math.round(maxDur * 0.25))}</span>
      <span>${formatDuration(Math.round(maxDur * 0.5))}</span>
      <span>${formatDuration(Math.round(maxDur * 0.75))}</span>
      <span>${formatDuration(maxDur)}</span>
    </div>`;

  container.innerHTML = html;
}
renderTimeline();

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderAgents(filteredAgents) {
  const container = document.getElementById("agentsList");
  const noResults = document.getElementById("noResults");

  if (filteredAgents.length === 0) {
    container.innerHTML = "";
    noResults.classList.remove("hidden");
    return;
  }
  noResults.classList.add("hidden");

  container.innerHTML = filteredAgents.map(a => {
    const roleCls = a.role === "s2" ? "role-s2" : a.role === "s3" ? "role-s3" : "role-verifier";
    const statusCls = a.status === "completed" ? "completed" :
                      a.status === "blocked" ? "blocked" :
                      a.status === "partial" ? "partial" : "inline";

      ? a.skills.map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join("")

// INTERACTIONS
// ═══════════════════════════════════════════════════════════
function toggleCard(id) {
  const card = document.getElementById(`agent-${id}`);
  card.classList.toggle("expanded");
}

function togglePrompt(event, id) {
  event.stopPropagation();
  const toggle = event.currentTarget;
  const content = document.getElementById(`prompt-${id}`);
  toggle.classList.toggle("open");
  content.classList.toggle("open");
}

function scrollToAgent(id) {
  const card = document.getElementById(`agent-${id}`);
  if (card) {
    card.scrollIntoView({ behavior: "smooth", block: "center" });
    card.classList.add("highlight");
    setTimeout(() => card.classList.remove("highlight"), 2000);
  }
}

// ── Filters ──
let activeRole = "all";
let activeStatus = "all";
let searchQuery = "";

function applyFilters() {
  let filtered = agents;

  if (activeRole !== "all") {
    filtered = filtered.filter(a => a.role === activeRole);
  }
  if (activeStatus !== "all") {
    filtered = filtered.filter(a => a.status === activeStatus);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(a =>
      a.mission.toLowerCase().includes(q) ||
      a.description.toLowerCase().includes(q) ||
      a.finding.toLowerCase().includes(q) ||
      a.prompt.toLowerCase().includes(q) ||
      a.roleLabel.toLowerCase().includes(q) ||
      (a.output && a.output.toLowerCase().includes(q)) ||
      (a.note && a.note.toLowerCase().includes(q)) ||
      a.skills.some(s => s.toLowerCase().includes(q)) ||
      a.filesRead.some(f => f.toLowerCase().includes(q))
    );
  }

  renderAgents(filtered);

  // Update timeline visibility
  document.querySelectorAll(".timeline-row").forEach(row => {
    const id = parseInt(row.dataset.agentId);
    const visible = filtered.some(a => a.id === id);
    row.style.display = visible ? "flex" : "none";
  });
}

document.querySelectorAll("#roleFilters .filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#roleFilters .filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeRole = btn.dataset.role;
    applyFilters();
  });
});

document.querySelectorAll("#statusFilters .filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#statusFilters .filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeStatus = btn.dataset.status;
    applyFilters();
  });
});

document.getElementById("searchBox").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  applyFilters();
});

document.getElementById("expandAll").addEventListener("click", () => {
  document.querySelectorAll(".agent-card").forEach(c => c.classList.add("expanded"));
});

document.getElementById("collapseAll").addEventListener("click", () => {
  document.querySelectorAll(".agent-card").forEach(c => c.classList.remove("expanded"));
});

// ── Keyboard shortcut ──
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== "INPUT") {
    e.preventDefault();
    document.getElementById("searchBox").focus();
  }
  if (e.key === "Escape") {
    document.getElementById("searchBox").blur();
    document.getElementById("searchBox").value = "";
    searchQuery = "";
    applyFilters();
  }
});
</script>
</body>
</html>
