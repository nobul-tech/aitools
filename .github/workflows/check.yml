# .github/workflows/check.yml
# CI pipeline for aitools: syntax validation, logging unit tests, build, cross-platform checks
# 3 runners: macOS (ARM), Linux (Ubuntu), Windows
#
# Bash management:
#   macOS runner: brew install bash (system bash is 3.2, need 5.x)
#   Linux runner: bash 5.x ships with Ubuntu (no action needed)
#   Windows runner: Git Bash ships bash 5.x (no action needed)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # =====================================================================
  # macOS (ARM) -- Primary development platform
  # =====================================================================
  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install modern bash via Homebrew
        run: |
          echo "::group::Installing bash"
          brew install bash
          echo "Homebrew bash version:"
          "$(brew --prefix)/bin/bash" --version | head -1
          echo "System bash version:"
          /bin/bash --version | head -1
          echo "::endgroup::"

      - name: Verify bash version
        run: |
          # Confirm #!/usr/bin/env bash resolves to Homebrew bash (5.x)
          BASH_VER=$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')
          echo "Resolved bash version: $BASH_VER"
          MAJOR=$(echo "$BASH_VER" | cut -d. -f1)
          if [ "$MAJOR" -lt 4 ]; then
            echo "::error::bash version $BASH_VER is below minimum 4.0"
            exit 1
          fi
          echo "bash $BASH_VER OK (>= 4.0)"

      - name: Validate bash script syntax
        run: |
          echo "::group::Checking .sh files"
          errors=0
          for f in scripts/*.sh scripts/githooks/pre-commit deploy/*.sh shared/hooks/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f" 2>/tmp/bash-syntax-err.txt; then
              echo "FAIL: $f"
              cat /tmp/bash-syntax-err.txt
              errors=$((errors + 1))
            fi
          done
          echo "::endgroup::"
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors bash file(s) failed syntax check"
            exit 1
          fi
          echo "All .sh files passed syntax validation"

      - name: Validate PowerShell script syntax
        run: |
          echo "::group::Checking .ps1 files"
          if command -v pwsh >/dev/null 2>&1; then
            errors=0
            for f in scripts/*.ps1 deploy/*.ps1; do
              [ -f "$f" ] || continue
              if ! pwsh -NoProfile -Command "
                \$e = \$null
                \$null = [System.Management.Automation.Language.Parser]::ParseFile('$f', [ref]\$null, [ref]\$e)
                if (\$e.Count -gt 0) { \$e | ForEach-Object { Write-Host \"  line \$(\$_.Extent.StartLineNumber): \$(\$_.Message)\" }; exit 1 }
              " 2>/dev/null; then
                echo "FAIL: $(basename "$f")"
                errors=$((errors + 1))
              fi
            done
            echo "::endgroup::"
            if [ "$errors" -gt 0 ]; then
              echo "::error::$errors ps1 file(s) failed syntax check"
              exit 1
            fi
            echo "All .ps1 files passed syntax validation"
          else
            echo "::warning::pwsh not available, skipping .ps1 validation"
            echo "::endgroup::"
          fi

      - name: Validate Python script syntax
        run: |
          errors=0
          for f in scripts/*.py; do
            [ -f "$f" ] || continue
            if ! python3 -m py_compile "$f" 2>/tmp/py-syntax-err.txt; then
              echo "FAIL: $f"
              cat /tmp/py-syntax-err.txt
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors Python file(s) failed syntax check"
            exit 1
          fi
          echo "All .py files passed syntax validation"

      - name: harness-db delegation score tests (Python)
        run: python3 tests/harness-db/test-delegation-score.py

      - name: Logging unit tests (bash)
        run: bash tests/logging/test-logging.sh

      - name: Logging unit tests (PowerShell)
        run: pwsh -NoProfile -File tests/logging/test-logging.ps1

      - name: Managed-file tests (bash)
        run: bash tests/managed-files/test-managed-files.sh

      - name: Managed-file tests (PowerShell)
        run: pwsh -NoProfile -File tests/managed-files/test-managed-files.ps1

      - name: Dotprofile adopt commit+push tests (bash)
        run: bash tests/managed-files/test-adopt-push.sh

      - name: Dotprofile adopt commit+push tests (PowerShell)
        run: pwsh -NoProfile -File tests/managed-files/test-adopt-push.ps1

      - name: Profile resolver tests (bash 5 + pwsh parity)
        run: bash tests/profile/test-profile.sh

      - name: Profile resolver tests (macOS /bin/bash 3.2)
        run: AITOOLS_TEST_BASH=/bin/bash /bin/bash tests/profile/test-profile.sh --bash-only

      - name: Config writer tests (bash 5 + pwsh parity)
        run: bash tests/profile/test-config.sh

      - name: Config writer tests (macOS /bin/bash 3.2)
        run: AITOOLS_TEST_BASH=/bin/bash /bin/bash tests/profile/test-config.sh --bash-only

      - name: Profile lib wrapper tests (bash 5 + pwsh)
        run: bash tests/profile/test-lib.sh

      - name: Profile lib wrapper tests (macOS /bin/bash 3.2)
        run: AITOOLS_TEST_BASH=/bin/bash /bin/bash tests/profile/test-lib.sh --bash-only

      - name: User init tests (bash 5 + pwsh parity, pty menus)
        run: bash tests/profile/test-user-init.sh

      - name: User init tests (macOS /bin/bash 3.2)
        run: AITOOLS_TEST_BASH=/bin/bash /bin/bash tests/profile/test-user-init.sh --bash-only

      - name: Installer Step 3/5 relay tests (bash 5 + pwsh)
        run: bash tests/profile/test-install.sh

      - name: Installer Step 3/5 relay tests (macOS /bin/bash 3.2)
        run: AITOOLS_TEST_BASH=/bin/bash /bin/bash tests/profile/test-install.sh --bash-only

      - name: setup-user-claude dev + MDM tests (bash 5 + pwsh)
        run: bash tests/claude-mdm/test-claude-mdm.sh

      - name: setup-user-claude dev + MDM tests (macOS /bin/bash 3.2)
        run: AITOOLS_TEST_BASH=/bin/bash /bin/bash tests/claude-mdm/test-claude-mdm.sh

      - name: delegation-duty-guard hook tests (bash 5)
        run: bash tests/hooks/test-delegation-duty-guard.sh

      - name: delegation-duty-guard hook tests (macOS /bin/bash 3.2)
        run: AITOOLS_TEST_BASH=/bin/bash /bin/bash tests/hooks/test-delegation-duty-guard.sh

      - name: build-deploy backup + swap tests (incident #86)
        run: bash tests/build-deploy/test-build-deploy-backup.sh

      - name: build-deploy backup + swap tests (macOS /bin/bash 3.2)
        run: AITOOLS_TEST_BASH=/bin/bash /bin/bash tests/build-deploy/test-build-deploy-backup.sh

      - name: Build deploy scripts
        run: |
          echo "::group::Running build-deploy.sh"
          bash scripts/build-deploy.sh
          echo "::endgroup::"

      - name: Check deploy drift
        run: |
          # Exclude files that embed user-specific data (profile.json, user rules):
          #   setup-user-claude.sh/.ps1 — embeds CLAUDE.md template + user rules
          #   setup-user-hooks.sh/.ps1  — embeds claude preferences
          #   setup-user-skills.sh/.ps1 — embeds skill content
          #   setup-user-cursor.sh/.ps1 — embeds cursor rules
          drift=$(git diff -- deploy/ \
            ':!deploy/setup-user-claude.sh' ':!deploy/setup-user-claude.ps1' \
            ':!deploy/setup-user-hooks.sh' ':!deploy/setup-user-hooks.ps1' \
            ':!deploy/setup-user-skills.sh' ':!deploy/setup-user-skills.ps1' \
            ':!deploy/setup-user-cursor.sh' ':!deploy/setup-user-cursor.ps1' \
            2>/dev/null || true)
          if [ -n "$drift" ]; then
            echo "::error::deploy/ is stale -- run build-deploy.sh and commit"
            git diff --stat deploy/
            exit 1
          fi
          # Show profile-dependent drift as info (expected on CI without user profile)
          profile_drift=$(git diff --stat -- \
            deploy/setup-user-claude.sh deploy/setup-user-claude.ps1 \
            deploy/setup-user-hooks.sh deploy/setup-user-hooks.ps1 \
            deploy/setup-user-skills.sh deploy/setup-user-skills.ps1 \
            deploy/setup-user-cursor.sh deploy/setup-user-cursor.ps1 \
            2>/dev/null || true)
          if [ -n "$profile_drift" ]; then
            echo "::notice::Profile-dependent deploy files differ (expected on CI without user profile)"
          fi
          echo "deploy/ drift check passed"

      - name: Line ending audit
        run: |
          # CRLF audit is disabled: deploy/*.sh and scripts/*.sh contain
          # intentional embedded CRLF (PS1 content generation), and
          # shared/hooks/*.sh has historical CRLF (pre-.gitattributes).
          # TODO: implement structural CRLF check that only audits shell
          # logic lines, not embedded PS1 content strings.
          echo "::notice::CRLF audit skipped (intentional mixed line endings in cross-platform scripts)"

      - name: Cross-platform script pairing
        run: |
          errors=0
          for f in scripts/setup-*.sh; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .sh)
            if [ ! -f "scripts/${base}.ps1" ]; then
              echo "Unpaired: scripts/${base}.sh (no .ps1)"
              errors=$((errors + 1))
            fi
          done
          for f in scripts/setup-*.ps1; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .ps1)
            if [ ! -f "scripts/${base}.sh" ]; then
              echo "Unpaired: scripts/${base}.ps1 (no .sh)"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors unpaired script(s)"
            exit 1
          fi
          echo "All setup scripts are paired"

  # =====================================================================
  # Linux (Ubuntu) -- CI baseline, validates Linux compatibility
  # =====================================================================
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bash version
        run: |
          BASH_VER=$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')
          echo "bash version: $BASH_VER"
          MAJOR=$(echo "$BASH_VER" | cut -d. -f1)
          if [ "$MAJOR" -lt 4 ]; then
            echo "::error::bash version $BASH_VER is below minimum 4.0"
            exit 1
          fi
          echo "bash $BASH_VER OK (>= 4.0)"

      - name: Validate bash script syntax
        run: |
          errors=0
          for f in scripts/*.sh scripts/githooks/pre-commit deploy/*.sh shared/hooks/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f" 2>/tmp/bash-syntax-err.txt; then
              echo "FAIL: $f"
              cat /tmp/bash-syntax-err.txt
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors bash file(s) failed syntax check"
            exit 1
          fi
          echo "All .sh files passed syntax validation"

      - name: Validate Python script syntax
        run: |
          errors=0
          for f in scripts/*.py; do
            [ -f "$f" ] || continue
            if ! python3 -m py_compile "$f" 2>/tmp/py-syntax-err.txt; then
              echo "FAIL: $f"
              cat /tmp/py-syntax-err.txt
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors Python file(s) failed syntax check"
            exit 1
          fi
          echo "All .py files passed syntax validation"

      - name: Hook-registration parity audit
        run: |
          # Same audit as check-post-push step 32: setup-user-hooks.sh/.ps1 and
          # build-deploy.sh must derive hook lists from hooks-manifest.json
          # (issue #9). Exits 1 with the failing check(s) on stdout.
          python3 scripts/check-hook-parity.py \
            shared/hooks/hooks-manifest.json \
            scripts/setup-user-hooks.sh \
            scripts/setup-user-hooks.ps1 \
            scripts/build-deploy.sh

      - name: harness-db delegation score tests (Python)
        run: python3 tests/harness-db/test-delegation-score.py

      - name: Logging unit tests (bash)
        run: bash tests/logging/test-logging.sh

      - name: Logging unit tests (PowerShell)
        run: pwsh -NoProfile -File tests/logging/test-logging.ps1

      - name: Managed-file tests (bash)
        run: bash tests/managed-files/test-managed-files.sh

      - name: Managed-file tests (PowerShell)
        run: pwsh -NoProfile -File tests/managed-files/test-managed-files.ps1

      - name: Dotprofile adopt commit+push tests (bash)
        run: bash tests/managed-files/test-adopt-push.sh

      - name: Dotprofile adopt commit+push tests (PowerShell)
        run: pwsh -NoProfile -File tests/managed-files/test-adopt-push.ps1

      - name: Profile resolver tests (bash + pwsh parity, incl. claude-code-web)
        run: bash tests/profile/test-profile.sh

      - name: Config writer tests (bash + pwsh parity)
        run: bash tests/profile/test-config.sh

      - name: Profile lib wrapper tests (bash + pwsh)
        run: bash tests/profile/test-lib.sh

      - name: User init tests (bash + pwsh parity, pty menus)
        run: bash tests/profile/test-user-init.sh

      - name: Installer Step 3/5 relay tests (bash + pwsh)
        run: bash tests/profile/test-install.sh

      - name: setup-user-claude dev + MDM tests (bash + pwsh)
        run: bash tests/claude-mdm/test-claude-mdm.sh

      - name: delegation-duty-guard hook tests
        run: bash tests/hooks/test-delegation-duty-guard.sh

      - name: build-deploy backup + swap tests (incident #86)
        run: bash tests/build-deploy/test-build-deploy-backup.sh

      - name: Build deploy scripts
        run: bash scripts/build-deploy.sh

      - name: Check deploy drift
        run: |
          drift=$(git diff -- deploy/ \
            ':!deploy/setup-user-claude.sh' ':!deploy/setup-user-claude.ps1' \
            ':!deploy/setup-user-hooks.sh' ':!deploy/setup-user-hooks.ps1' \
            ':!deploy/setup-user-skills.sh' ':!deploy/setup-user-skills.ps1' \
            ':!deploy/setup-user-cursor.sh' ':!deploy/setup-user-cursor.ps1' \
            2>/dev/null || true)
          if [ -n "$drift" ]; then
            echo "::error::deploy/ is stale -- run build-deploy.sh and commit"
            exit 1
          fi

  # =====================================================================
  # Windows -- validates PS1 scripts natively + bash scripts via Git Bash
  # =====================================================================
  windows:
    runs-on: windows-2022
    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false
        shell: bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Git Bash version
        shell: bash
        run: |
          BASH_VER=$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')
          echo "Git Bash version: $BASH_VER"
          MAJOR=$(echo "$BASH_VER" | cut -d. -f1)
          if [ "$MAJOR" -lt 4 ]; then
            echo "::error::Git Bash version $BASH_VER is below minimum 4.0"
            exit 1
          fi
          echo "Git Bash $BASH_VER OK (>= 4.0)"

      - name: Validate bash script syntax (via Git Bash)
        shell: bash
        run: |
          errors=0
          for f in scripts/*.sh scripts/githooks/pre-commit deploy/*.sh shared/hooks/*.sh; do
            [ -f "$f" ] || continue
            if ! bash -n "$f" 2>/tmp/bash-syntax-err.txt; then
              echo "FAIL: $f"
              cat /tmp/bash-syntax-err.txt
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors bash file(s) failed syntax check"
            exit 1
          fi
          echo "All .sh files passed syntax validation"

      - name: Validate PowerShell script syntax (native)
        shell: pwsh
        run: |
          $errors = 0
          $files = Get-ChildItem -Path "scripts/*.ps1", "deploy/*.ps1" -ErrorAction SilentlyContinue
          foreach ($f in $files) {
              $parseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                  $f.FullName, [ref]$null, [ref]$parseErrors)
              if ($parseErrors.Count -gt 0) {
                  Write-Host "FAIL: $($f.Name)"
                  $parseErrors | ForEach-Object {
                      Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)"
                  }
                  $errors++
              }
          }
          if ($errors -gt 0) {
              Write-Error "$errors ps1 file(s) failed syntax check"
              exit 1
          }
          Write-Host "All .ps1 files passed syntax validation"

      - name: harness-db delegation score tests (Python, native)
        shell: pwsh
        run: python tests/harness-db/test-delegation-score.py

      - name: Logging unit tests (bash, via Git Bash)
        shell: bash
        run: bash tests/logging/test-logging.sh

      - name: Logging unit tests (PowerShell, native)
        shell: pwsh
        run: pwsh -NoProfile -File tests/logging/test-logging.ps1

      - name: Managed-file tests (bash, via Git Bash)
        shell: bash
        run: bash tests/managed-files/test-managed-files.sh

      - name: Managed-file tests (PowerShell, native)
        shell: pwsh
        run: pwsh -NoProfile -File tests/managed-files/test-managed-files.ps1

      - name: Dotprofile adopt commit+push tests (bash, via Git Bash)
        shell: bash
        run: bash tests/managed-files/test-adopt-push.sh

      - name: Dotprofile adopt commit+push tests (PowerShell, native)
        shell: pwsh
        run: pwsh -NoProfile -File tests/managed-files/test-adopt-push.ps1

      - name: delegation-duty-guard hook tests (via Git Bash)
        shell: bash
        run: bash tests/hooks/test-delegation-duty-guard.sh

      - name: Profile resolver (PowerShell, native machine id and hostname)
        shell: pwsh
        run: |
          # First execution of the Windows detection paths (MachineGuid, COMPUTERNAME)
          $id = & pwsh -NoProfile -File scripts/aitools-profile.ps1 machine-id
          if ($LASTEXITCODE -ne 0 -or $id -notmatch '^[0-9a-fA-F-]{36}$') { Write-Error "machine-id failed (exit $LASTEXITCODE): $id"; exit 1 }
          $h = & pwsh -NoProfile -File scripts/aitools-profile.ps1 hostname
          if ($LASTEXITCODE -ne 0 -or -not $h) { Write-Error "hostname failed (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "machine-id: $id  hostname: $h"
          $out = & pwsh -NoProfile -File scripts/aitools-profile.ps1 resolve
          if ($LASTEXITCODE -ne 1) { Write-Error "resolve without a dotprofile: exit $LASTEXITCODE, want 1"; $out; exit 1 }
          Write-Host "resolve without a dotprofile: exit 1 (shared-only)"
          # register on win32 (native id, CRLF-free output) and the mixed path form
          $d = Join-Path $env:RUNNER_TEMP "aitools-nobul-ci"
          New-Item -ItemType Directory -Path $d -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $d "profile.json"), "{`n  `"version`": 2,`n  `"profiles`": {}`n}`n", [Text.UTF8Encoding]::new($false))
          $reg = & pwsh -NoProfile -File scripts/aitools-profile.ps1 register --profile (Join-Path $d "profile.json") --alias ci --shell pwsh --out (Join-Path $d "out.json")
          if ($LASTEXITCODE -ne 0 -or ($reg -join "`n") -notmatch "result`tcreated") { Write-Error "register failed (exit $LASTEXITCODE): $reg"; exit 1 }
          $written = [IO.File]::ReadAllText((Join-Path $d "out.json"))
          if ($written.Contains("`r") -or $written -notmatch '"os": "win32"' -or $written -notmatch [regex]::Escape("`"id`": `"$id`"")) { Write-Error "register output unexpected:`n$written"; exit 1 }
          Write-Host "register on win32: ok (LF only, os win32, raw MachineGuid)"
          $env:AITOOLS_USER_REPO_PATH = $d
          $p = & pwsh -NoProfile -File scripts/aitools-profile.ps1 user-repo-path --plain --path-form mixed
          $env:AITOOLS_USER_REPO_PATH = $null
          if ($LASTEXITCODE -ne 0 -or $p -ne ($d -replace '\\', '/')) { Write-Error "user-repo-path --path-form mixed: '$p' (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "user-repo-path --path-form mixed: $p"
          # setup-user-config.ps1 natively (the runner HOME is ephemeral): created, then verified
          $cfgFile = Join-Path $HOME ".aitools\config.json"
          & pwsh -NoProfile -File scripts/setup-user-config.ps1 -ReposPath (Join-Path $env:RUNNER_TEMP "repos") -RepoPath $PWD.Path
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $cfgFile)) { Write-Error "setup-user-config.ps1 failed (exit $LASTEXITCODE)"; exit 1 }
          $cfgText = [IO.File]::ReadAllText($cfgFile)
          if ($cfgText.Contains("`r") -or $cfgText -notmatch '"version": 3' -or $cfgText -notmatch '"writer": "setup-user-config"') { Write-Error "config.json unexpected:`n$cfgText"; exit 1 }
          & pwsh -NoProfile -File scripts/setup-user-config.ps1
          if ($LASTEXITCODE -ne 0 -or [IO.File]::ReadAllText($cfgFile) -cne $cfgText) { Write-Error "setup-user-config.ps1 re-run changed config.json (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "setup-user-config.ps1: created, then verified (LF only, version 3)"
          # The runner appends `exit $LASTEXITCODE` to pwsh steps; the expected
          # exit 1 from resolve would otherwise fail the step.
          exit 0

      - name: Build deploy scripts (via Git Bash)
        shell: bash
        run: bash scripts/build-deploy.sh

      - name: Check deploy drift
        shell: bash
        run: |
          drift=$(git diff -- deploy/ \
            ':!deploy/setup-user-claude.sh' ':!deploy/setup-user-claude.ps1' \
            ':!deploy/setup-user-hooks.sh' ':!deploy/setup-user-hooks.ps1' \
            ':!deploy/setup-user-skills.sh' ':!deploy/setup-user-skills.ps1' \
            ':!deploy/setup-user-cursor.sh' ':!deploy/setup-user-cursor.ps1' \
            2>/dev/null || true)
          if [ -n "$drift" ]; then
            echo "::group::Deploy drift details"
            git diff --stat -- deploy/ \
              ':!deploy/setup-user-claude.sh' ':!deploy/setup-user-claude.ps1' \
              ':!deploy/setup-user-hooks.sh' ':!deploy/setup-user-hooks.ps1' \
              ':!deploy/setup-user-skills.sh' ':!deploy/setup-user-skills.ps1' \
              ':!deploy/setup-user-cursor.sh' ':!deploy/setup-user-cursor.ps1'
            echo "::endgroup::"
            # Windows Git Bash build may produce minor line-ending diffs
            echo "::warning::deploy/ has non-profile drift on Windows (may be line-ending)"
          fi
